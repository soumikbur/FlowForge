# ==============================================================================
# FlowForge - Render Blueprint Full-Stack Infrastructure Specification
# ==============================================================================
# Deploy the complete FlowForge platform (Postgres, Redis, API, Worker, Web)
# Docs: https://render.com/docs/blueprint-spec
# ==============================================================================

version: "1"

services:
  # ----------------------------------------------------------------------------
  # 1. FlowForge Web Frontend (Next.js 14 App Router)
  # ----------------------------------------------------------------------------
  - type: web
    name: flowforge-web
    runtime: docker
    dockerfilePath: apps/web/Dockerfile
    dockerContext: .
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: flowforge-api
          property: host

  # ----------------------------------------------------------------------------
  # 2. FlowForge REST API Gateway (Express.js)
  # ----------------------------------------------------------------------------
  - type: web
    name: flowforge-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flowforge-redis
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: WEB_URL
        fromService:
          type: web
          name: flowforge-web
          property: host

  # ----------------------------------------------------------------------------
  # 3. FlowForge Background Execution Worker (BullMQ Execution Runner)
  # ----------------------------------------------------------------------------
  - type: worker
    name: flowforge-worker
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    plan: standard
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: flowforge-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: flowforge-redis
          property: connectionString
      - key: ENCRYPTION_KEY
        fromService:
          type: web
          name: flowforge-api
          envVarKey: ENCRYPTION_KEY

  # ----------------------------------------------------------------------------
  # 4. Redis Queue & In-Memory Store
  # ----------------------------------------------------------------------------
  - type: redis
    name: flowforge-redis
    plan: standard
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  # ----------------------------------------------------------------------------
  # 5. PostgreSQL Database
  # ----------------------------------------------------------------------------
  - name: flowforge-postgres
    databaseName: flowforge_db
    user: flowforge
    plan: standard
    postgresMajorVersion: "16"
