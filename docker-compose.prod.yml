version: "3.8"

networks:
  flowforge-gateway:
    driver: bridge
  flowforge-internal:
    internal: true

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowforge-prod-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowforge}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge_db}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - flowforge-internal
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-flowforge} -d ${POSTGRES_DB:-flowforge_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: flowforge-prod-redis
    restart: always
    volumes:
      - redis_prod_data:/data
    networks:
      - flowforge-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: flowforge-prod-api
    restart: always
    ports:
      - "127.0.0.1:4000:4000"
    env_file:
      - .env.production
    networks:
      - flowforge-internal
      - flowforge-gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    container_name: flowforge-prod-worker
    restart: always
    env_file:
      - .env.production
    networks:
      - flowforge-internal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2048M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: flowforge-prod-web
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:4000}
      NODE_ENV: production
    networks:
      - flowforge-gateway
    depends_on:
      api:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1024M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  postgres_prod_data:
  redis_prod_data:
