name: Deploy GitHub Pages Portal & Documentation

on:
  push:
    branches:
      - main
    paths:
      - "public_pages/**"
      - "graphify-out/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Pages Artifact
        run: |
          mkdir -p _site
          cp -r public_pages/* _site/
          if [ -f graphify-out/graph.html ]; then
            cp graphify-out/graph.html _site/graph.html
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
