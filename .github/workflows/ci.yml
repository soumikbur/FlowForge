name: FlowForge CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gates:
    name: Code Quality & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Formatting Check
        run: pnpm format

      - name: ESLint
        run: pnpm lint

      - name: TypeScript Check
        run: pnpm typecheck

  test-suite:
    name: Automated Unit, Integration & Security Tests
    needs: quality-gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flowforge
          POSTGRES_PASSWORD: flowforge_password
          POSTGRES_DB: flowforge_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Deploy Database Migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: "postgresql://flowforge:flowforge_password@localhost:5432/flowforge_db?schema=public"

      - name: Run Test Suites
        run: pnpm test
        env:
          DATABASE_URL: "postgresql://flowforge:flowforge_password@localhost:5432/flowforge_db?schema=public"
          REDIS_URL: "redis://localhost:6379"
          SESSION_SECRET: "flowforge-super-secret-session-key-change-in-production-min-32-chars"
          ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
          NODE_ENV: test

  build-artifacts:
    name: Production Monorepo Build
    needs: test-suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build Packages & Apps
        run: pnpm build

  container-validation:
    name: Container Build & Topology Dry Run
    needs: build-artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate API Dockerfile
        run: docker build --dry-run -f apps/api/Dockerfile . || docker build -t flowforge-api:ci -f apps/api/Dockerfile .

      - name: Validate Worker Dockerfile
        run: docker build --dry-run -f apps/worker/Dockerfile . || docker build -t flowforge-worker:ci -f apps/worker/Dockerfile .

      - name: Validate Web Dockerfile
        run: docker build --dry-run -f apps/web/Dockerfile . || docker build -t flowforge-web:ci -f apps/web/Dockerfile .
