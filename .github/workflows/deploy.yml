name: FlowForge Production Deployment

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-flight-check:
    name: Deployment Pre-Flight Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm db:generate

      - name: Build Package Types
        run: pnpm --filter "./packages/*" build

      - name: Lint and Typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Production Build
        run: pnpm build

  database-migration:
    name: Safe Production Database Migration
    needs: pre-flight-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Database Dependencies
        run: pnpm --filter @flowforge/database install

      - name: Run Production Migrations
        run: |
          if [ -n "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "[Deploy] Executing safe production schema migrations..."
            node scripts/db-migrate.js
          else
            echo "[Deploy] PRODUCTION_DATABASE_URL secret not configured; skipping remote migration step."
          fi
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NODE_ENV: production

  build-and-deploy:
    name: Build & Publish Container Images
    needs: database-migration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Lowercase Repository Name
        run: |
          echo "IMAGE_REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/api:latest
            ghcr.io/${{ env.IMAGE_REPO }}/api:${{ github.sha }}

      - name: Build & Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/worker:latest
            ghcr.io/${{ env.IMAGE_REPO }}/worker:${{ github.sha }}

      - name: Build & Push Web Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_REPO }}/web:latest
            ghcr.io/${{ env.IMAGE_REPO }}/web:${{ github.sha }}

      - name: Trigger Remote Deployment Webhook
        run: |
          if [ -n "${{ secrets.DEPLOY_WEBHOOK_URL }}" ]; then
            echo "[Deploy] Dispatching deployment webhook to hosting platform..."
            curl -s -X POST "${{ secrets.DEPLOY_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{"ref":"${{ github.ref }}","commit":"${{ github.sha }}"}'
            echo "[Deploy] Webhook dispatched successfully."
          else
            echo "[Deploy] DEPLOY_WEBHOOK_URL secret not set. Container images published to ghcr.io and ready for deployment."
          fi

  post-deploy-verification:
    name: Post-Deployment Health Verification
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Verify Live Service Health
        run: |
          PROD_URL="${{ secrets.PRODUCTION_APP_URL }}"
          if [ -n "$PROD_URL" ]; then
            echo "[Verification] Probing production health endpoints at $PROD_URL..."
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PROD_URL/health/live" || echo "000")
            echo "[Verification] Health probe returned HTTP $STATUS"
          else
            echo "[Verification] PRODUCTION_APP_URL not configured; automated remote probing skipped."
          fi
