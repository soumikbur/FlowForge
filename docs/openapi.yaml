openapi: 3.0.3
info:
  title: FlowForge REST API
  description: Business Workflow Automation Engine API with Multi-Tenant Authorization, Workflow Lifecycle Management, and Immutable Versioning.
  version: 1.0.0
servers:
  - url: http://localhost:3001
    description: Local API Development Server
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: flowforge_session
    bearerAuth:
      type: http
      scheme: bearer
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key authentication via X-API-Key header or Bearer token (ff_live_... or ff_test_...)
    oauth2ClientCredentials:
      type: oauth2
      description: OAuth 2.0 Machine-to-Machine Client Credentials Grant (RFC 6749)
      flows:
        clientCredentials:
          tokenUrl: /api/v1/oauth/token
          scopes:
            workflows:read: Read workflows and definitions
            workflows:write: Create and update workflows
            executions:read: Inspect workflow executions
            executions:write: Dispatch and cancel workflow executions
            approvals:read: Inspect pending approvals
            approvals:write: Decide approval steps
            connectors:read: List connector metadata
            connectors:write: Manage connectors
            usage:read: View usage and analytics
            webhooks:read: Read webhook subscriptions
            webhooks:write: Manage webhook subscriptions
  schemas:
    ApiResponseEnvelope:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          nullable: true
        error:
          type: object
          nullable: true
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object
        meta:
          type: object
          properties:
            page:
              type: integer
            pageSize:
              type: integer
            total:
              type: integer
            totalPages:
              type: integer
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - organizationName
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        firstName:
          type: string
        lastName:
          type: string
        organizationName:
          type: string
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CreateOrganizationRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
    UpdateOrganizationRequest:
      type: object
      properties:
        name:
          type: string
    InviteMemberRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
          default: MEMBER
    UpdateMemberRoleRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum: [OWNER, ADMIN, MEMBER]
    CreateWorkflowRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        description:
          type: string
    UpdateWorkflowRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        nodes:
          type: array
          items:
            type: object
        edges:
          type: array
          items:
            type: object

paths:
  /health:
    get:
      summary: Liveness health check
      responses:
        "200":
          description: Service process is running
  /ready:
    get:
      summary: Dependency readiness check
      responses:
        "200":
          description: Dependencies are connected and ready
        "503":
          description: Dependencies disconnected

  /api/v1/auth/register:
    post:
      summary: Register user and provision primary organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User and organization successfully registered
        "400":
          description: Validation failure
        "409":
          description: User email already registered

  /api/v1/auth/login:
    post:
      summary: Authenticate user credentials and establish session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful authentication
        "401":
          description: Invalid email or password

  /api/v1/auth/logout:
    post:
      summary: Terminate session and invalidate session cookie
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Logged out successfully

  /api/v1/auth/me:
    get:
      summary: Retrieve current authenticated user profile and memberships
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Profile and active organization context

  /api/v1/organizations:
    get:
      summary: List all organizations the user is a member of
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: List of organizations
    post:
      summary: Create new organization and assign caller as OWNER
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrganizationRequest"
      responses:
        "201":
          description: Organization created

  /api/v1/organizations/{organizationId}:
    get:
      summary: Get organization details
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Organization details
        "403":
          description: Non-member access denied
        "404":
          description: Organization not found
    patch:
      summary: Update organization settings
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOrganizationRequest"
      responses:
        "200":
          description: Organization updated

  /api/v1/organizations/{organizationId}/members:
    get:
      summary: List members in an organization
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member list
    post:
      summary: Invite or add member to organization
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteMemberRequest"
      responses:
        "201":
          description: Member added
        "403":
          description: Insufficient permissions or unauthorized role assignment
        "409":
          description: User is already a member

  /api/v1/organizations/{organizationId}/members/{membershipId}:
    patch:
      summary: Update member role (enforcing Last Owner Protection)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
        - in: path
          name: membershipId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMemberRoleRequest"
      responses:
        "200":
          description: Member role updated
        "400":
          description: Cannot demote the last owner
        "403":
          description: Forbidden
    delete:
      summary: Remove member from organization (enforcing Last Owner Protection)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
        - in: path
          name: membershipId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member removed
        "400":
          description: Cannot remove the last owner
        "403":
          description: Forbidden

  /api/v1/organizations/{organizationId}/audit-logs:
    get:
      summary: Query organization audit log events
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated audit log records

  /api/v1/workflows:
    get:
      summary: List workflows with pagination, search, and status filtering
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [DRAFT, ACTIVE, ARCHIVED]
      responses:
        "200":
          description: Paginated workflows
    post:
      summary: Create workflow draft
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkflowRequest"
      responses:
        "201":
          description: Workflow draft created

  /api/v1/workflows/{id}:
    get:
      summary: Retrieve single workflow draft and published versions
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow details
        "404":
          description: Workflow not found or archived
    patch:
      summary: Update workflow draft definition
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkflowRequest"
      responses:
        "200":
          description: Workflow draft updated
    delete:
      summary: Soft-delete / archive workflow (preserves executions and versions)
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Workflow archived successfully

  /api/v1/workflows/{id}/validate:
    post:
      summary: Validate workflow draft graph without publishing
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validation result object with AST errors

  /api/v1/workflows/{id}/publish:
    post:
      summary: Validate draft and publish as a new immutable version
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Workflow published into immutable version
        "400":
          description: Graph validation failed

  /api/v1/workflows/{id}/versions:
    get:
      summary: List all immutable published versions of a workflow
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of published version snapshots
  /api/v1/workflows/{id}/versions/{versionId}:
    get:
      summary: Retrieve specific immutable version snapshot
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: path
          name: versionId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Immutable version snapshot definition

  /api/v1/oauth/token:
    post:
      summary: Obtain OAuth 2.0 access token via client credentials grant
      description: Exchanges client_id and client_secret for an OAuth Bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - grant_type
                - client_id
                - client_secret
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                client_id:
                  type: string
                client_secret:
                  type: string
                scope:
                  type: string
      responses:
        "200":
          description: OAuth access token issued successfully
        "400":
          description: Invalid request or unauthorized scope
        "401":
          description: Client authentication failed

  /api/v1/organizations/{organizationId}/oauth/clients:
    post:
      summary: Register confidential OAuth 2.0 client
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: OAuth client registered
    get:
      summary: List registered OAuth clients
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of OAuth clients

  /api/v1/organizations/{organizationId}/api-keys:
    post:
      summary: Create new API key
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      responses:
        "201":
          description: API key created with secret displayed once
    get:
      summary: List organization API keys
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of active API keys

  /api/v1/organizations/{organizationId}/api-keys/{keyId}/rotate:
    post:
      summary: Rotate API key secret
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - in: path
          name: organizationId
          required: true
          schema:
            type: string
        - in: path
          name: keyId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: API key secret rotated with new secret displayed once

  /api/v1/webhooks/subscriptions:
    get:
      summary: List outbound webhook subscriptions
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "200":
          description: List of subscriptions
    post:
      summary: Create outbound webhook subscription
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      responses:
        "201":
          description: Webhook subscription created with signing secret displayed once

  /api/v1/organizations/{organizationId}/ai/config:
    get:
      summary: Get AI configuration for organization
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Sanitized AI configuration with redacted credentials
    put:
      summary: Update AI configuration for organization
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Updated AI configuration

  /api/v1/organizations/{organizationId}/ai/generate-workflow:
    post:
      summary: AI-assisted workflow draft generation
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Validated untrusted workflow draft
        "400":
          description: Validation error or prompt injection detected
        "429":
          description: Monthly AI token budget exceeded

  /api/v1/organizations/{organizationId}/ai/edit-workflow:
    post:
      summary: Conversational workflow draft modification
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Modified workflow draft with structured diff
        "409":
          description: Stale draft conflict detected

  /api/v1/organizations/{organizationId}/ai/explain-workflow:
    post:
      summary: Workflow topology and risk analysis
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Workflow explanation and risk profile

  /api/v1/organizations/{organizationId}/ai/analyze-failure:
    post:
      summary: Read-only execution failure root-cause analysis
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        "200":
          description: Execution failure diagnostics and suggested remediations

  /api/v1/organizations/{organizationId}/intelligence/metrics:
    get:
      summary: Business process metrics and KPIs
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d, 90d]
      responses:
        "200":
          description: Process metrics including duration percentiles, volume, error rate, queue/approval/connector latency
        "400":
          description: Invalid query parameters
        "403":
          description: Insufficient permissions (requires analytics:read)

  /api/v1/organizations/{organizationId}/intelligence/bottlenecks:
    get:
      summary: Rule-based process bottleneck detection
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d, 90d]
      responses:
        "200":
          description: List of detected bottlenecks with evidence and impact
        "403":
          description: Insufficient permissions (requires analytics:read)

  /api/v1/organizations/{organizationId}/intelligence/anomalies:
    get:
      summary: Statistical anomaly detection
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: query
          schema:
            type: string
        - name: window
          in: query
          schema:
            type: string
            enum: [1h, 24h, 7d, 30d, 90d]
      responses:
        "200":
          description: Statistical duration/failure anomalies with z-scores and baseline stats
        "403":
          description: Insufficient permissions (requires analytics:read)

  /api/v1/organizations/{organizationId}/intelligence/compare:
    get:
      summary: Workflow version comparison and regression detection
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: query
          required: true
          schema:
            type: string
        - name: baseVersion
          in: query
          required: true
          schema:
            type: integer
        - name: targetVersion
          in: query
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Version comparison report with duration/reliability deltas and regression flags
        "403":
          description: Insufficient permissions (requires analytics:read)

  /api/v1/organizations/{organizationId}/intelligence/outcomes:
    post:
      summary: Record business outcome for an execution
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - executionId
                - workflowId
                - outcomeName
                - status
              properties:
                executionId:
                  type: string
                workflowId:
                  type: string
                outcomeName:
                  type: string
                status:
                  type: string
                  enum: [ACHIEVED, PARTIAL, MISSED, ABANDONED]
                businessValue:
                  type: number
                currency:
                  type: string
                targetDurationMs:
                  type: integer
                actualDurationMs:
                  type: integer
                slaAttained:
                  type: boolean
                metadata:
                  type: object
      responses:
        "201":
          description: Business outcome recorded
        "403":
          description: Insufficient permissions (requires analytics:write)
    get:
      summary: Query business outcomes and SLA attainment
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of business outcomes with aggregated SLA attainment
        "403":
          description: Insufficient permissions (requires analytics:read)

  /api/v1/organizations/{organizationId}/intelligence/slos:
    post:
      summary: Create Service Level Objective (SLO) for a workflow
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - workflowId
                - targetType
                - targetValue
              properties:
                name:
                  type: string
                description:
                  type: string
                workflowId:
                  type: string
                targetType:
                  type: string
                  enum: [SUCCESS_RATE, DURATION_P95, DURATION_P99, DURATION_AVG]
                targetValue:
                  type: number
                windowHours:
                  type: integer
      responses:
        "201":
          description: SLO created successfully
        "403":
          description: Insufficient permissions (requires analytics:write)
    get:
      summary: List SLOs and compliance evaluations
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of SLOs with live compliance and error budget tracking
        "403":
          description: Insufficient permissions (requires analytics:read)

  /api/v1/organizations/{organizationId}/intelligence/slos/{sloId}/evaluation:
    get:
      summary: Get live evaluation and error budget for a single SLO
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: sloId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evaluated SLO status, remaining error budget, and compliance flag
        "404":
          description: SLO not found

  /api/v1/organizations/{organizationId}/intelligence/recommendations:
    get:
      summary: Actionable workflow optimization recommendations
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
        - name: workflowId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Optimization recommendations categorized by PARALLELIZATION, CACHING, TIMEOUT, RETRY, APPROVAL
        "403":
          description: Insufficient permissions (requires analytics:read)

  /api/v1/organizations/{organizationId}/intelligence/insights/ai:
    post:
      summary: Evidence-grounded advisory AI operational insights
      security:
        - cookieAuth: []
        - bearerAuth: []
        - apiKeyAuth: []
      parameters:
        - name: organizationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - workflowId
              properties:
                workflowId:
                  type: string
                window:
                  type: string
                  enum: [1h, 24h, 7d, 30d, 90d]
      responses:
        "200":
          description: Advisory AI operational insight with grounded evidence and suggested actions
        "403":
          description: Insufficient permissions (requires analytics:read)

  /api/v1/organizations/{organizationId}/intelligence/export:
    get:
